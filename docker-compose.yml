# rpcrouter 部署编排。
# 基础 profile：仅运行网关服务，挂载 data 卷并给出环境变量覆写示例。
# monitoring profile（`docker compose --profile monitoring up -d`）额外拉起
# Prometheus + Grafana，引用 ./ops/prometheus/prometheus.yml 与 ./ops/grafana/；
# 这些 ops 文件由另一工作流提供，当前缺失时基础 profile 不受影响。

services:
  redis:
    image: redis:7-alpine
    container_name: rpcrouter-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks:
      - rpcrouter-net

  rpcrouter:
    image: rpcrouter:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpcrouter
    restart: unless-stopped
    ports:
      - "8545:8545"
    volumes:
      # chainlist 磁盘缓存跨重启复用；若需使用外部配置文件，可追加挂载 config.toml。
      - rpcrouter-data:/app/data
    environment:
      RPCROUTER_REDIS_URL: "redis://redis:6379/0"
      # 环境变量覆写 config 关键项（详见 config.rs 的 apply_env_overrides）。
      RPCROUTER_LISTEN: "0.0.0.0:8545"
      RPCROUTER_ADMIN_STATIC_DIR: "/app/dashboard"
      RPCROUTER_CHAINS: "1,143,56,137,42161,8453,10,43114,11155111"
      RPCROUTER_CACHE_MAX_BYTES: "536870912"
      RPCROUTER_METRICS_ENABLED: "true"
      RPCROUTER_CHAINLIST_REFRESH_SECONDS: "3600"
      RPCROUTER_CHAINLIST_CACHE_PATH: "/app/data/rpcs.json"
      RPCROUTER_DISCOVERY_ENABLED: "true"
      RPCROUTER_DISCOVERY_MAX_HOT_CHAINS: "256"
      RPCROUTER_DISCOVERY_IDLE_SECONDS: "600"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8545/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - rpcrouter-net

  rpcrouter-1:
    image: rpcrouter:latest
    profiles: ["cluster"]
    restart: unless-stopped
    expose: ["8545"]
    volumes: ["rpcrouter-cluster-1:/app/data", "./cluster.toml:/app/cluster.toml:ro"]
    environment:
      RPCROUTER_REDIS_URL: "redis://redis:6379/0"
      RPCROUTER_CONFIG: "/app/cluster.toml"
    depends_on:
      redis:
        condition: service_healthy
    networks: [rpcrouter-net]
  rpcrouter-2:
    image: rpcrouter:latest
    profiles: ["cluster"]
    restart: unless-stopped
    expose: ["8545"]
    volumes: ["rpcrouter-cluster-2:/app/data", "./cluster.toml:/app/cluster.toml:ro"]
    environment:
      RPCROUTER_REDIS_URL: "redis://redis:6379/0"
      RPCROUTER_CONFIG: "/app/cluster.toml"
    depends_on:
      redis:
        condition: service_healthy
    networks: [rpcrouter-net]
  rpcrouter-3:
    image: rpcrouter:latest
    profiles: ["cluster"]
    restart: unless-stopped
    expose: ["8545"]
    volumes: ["rpcrouter-cluster-3:/app/data", "./cluster.toml:/app/cluster.toml:ro"]
    environment:
      RPCROUTER_REDIS_URL: "redis://redis:6379/0"
      RPCROUTER_CONFIG: "/app/cluster.toml"
    depends_on:
      redis:
        condition: service_healthy
    networks: [rpcrouter-net]
  nginx:
    image: nginx:1.27-alpine
    profiles: ["cluster"]
    ports: ["18545:80"]
    volumes: ["./deploy/nginx-shard-compose.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [rpcrouter-1, rpcrouter-2, rpcrouter-3]
    networks: [rpcrouter-net]

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    container_name: rpcrouter-prometheus
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    depends_on:
      - rpcrouter
    networks:
      - rpcrouter-net

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    container_name: rpcrouter-grafana
    restart: unless-stopped
    environment:
      # 生产部署务必通过环境变量注入强密码，默认值仅供本地演示
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - rpcrouter-net

volumes:
  rpcrouter-data:
  prometheus-data:
  grafana-data:
  redis-data:
  rpcrouter-cluster-1:
  rpcrouter-cluster-2:
  rpcrouter-cluster-3:

networks:
  rpcrouter-net:
    driver: bridge
