listen = "0.0.0.0:8545"
metrics_enabled = true
chains = [1, 143, 56, 137, 42161, 8453, 10, 43114]

[server]
batch_limit = 100
# 优雅退出排空 deadline（毫秒）：收到 SIGTERM/SIGINT 后等待在飞请求排空的时长，超时强退。
shutdown_deadline_ms = 10000
# 入口请求体大小上限（字节），超限返回 HTTP 413 + JSON-RPC 错误体。
max_body_bytes = 262144
# 全局并发上限（同时在飞的入口请求数），过载快速拒绝（HTTP 503 + JSON-RPC 错误体）。
max_concurrent_requests = 1024
# /metrics bearer token 鉴权（可选）。默认不鉴权；如需开启，取消注释并填 token。
# metrics_auth_token = ""

# 每 IP 限速（默认关闭）。
[server.per_ip_rate_limit]
enabled = false
requests_per_second = 20
burst = 40

[chainlist]
url = "https://chainlist.org/rpcs.json"
refresh_seconds = 3600
stale_grace_seconds = 86400
cache_path = "./data/rpcs.json"

[discovery]
enabled = true
include_testnets = true
deny = []
max_hot_chains = 256
idle_seconds = 600

# 自动开启：按规则批量常驻开启优质 EVM 主网链（只增不减，减法只有人工 unpin/disable）。
[discovery.auto_enable]
enabled = true
min_endpoints = 5              # 静态门槛：去重后的公开 https 端点数
max_chains = 400               # 自动集合上限（达到即停止新增，不淘汰已开启链）
max_candidates = 512           # 候选池上限
max_endpoints_per_chain = 8    # 每链每轮采样探测的端点数上限
candidate_interval_seconds = 30
probe_batch = 32               # 每轮探测的候选链数（指针轮转）
probe_concurrency = 8          # 候选探测全局并发上限
promote_after_rounds = 2       # 连续合格轮次达标才晋级
min_active_endpoints = 2
head_tolerance_blocks = 64

[upstream]
request_timeout_ms = 5000
slow_threshold_ms = 4000
deadline_ms = 15000
max_attempts = 4
default_rps = 15
default_concurrency = 8

[probe]
min_interval_seconds = 15
max_interval_seconds = 30
max_concurrency = 32
request_timeout_ms = 5000
max_block_lag = 5

[cache]
max_bytes = 536870912
immutable_ttl_seconds = 3600

[hedging]
enabled = true
delay_ms = 300
max_percent = 10
min_active_endpoints = 2

[state]
backend = "redis"
redis_url = "redis://127.0.0.1:6379/0"
namespace = "rpcrouter"
required = false
flush_interval_ms = 2000
health_ttl_seconds = 86400

[admin]
enabled = true
public_site = true
# auth_token = "..."
# static_dir = "./dashboard/dist"
# cors_allow_origins = ["http://localhost:5173"]
# allow_private_endpoints = false

